name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: "**/*.md"

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose "**/*.md"
          fail: true

  spell-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: streetsidesoftware/cspell-action@v6
        with:
          files: "**/*.md"
          config: "cspell.json"

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  mutation-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx stryker run
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/

  prompt-integrity:
    # Two checks over the prompt tree that no human should ever be the one to run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python deps
        run: |
          pip install pytest
          pip install -r scripts/vps/requirements.txt

      # Blocking: the Spark pre-flight linter and the production allowlist parser
      # must extract identical paths. They drifted once already, and the drift
      # deleted valid specs.
      - name: Allowlist parity (linter vs parser)
        run: pytest scripts/vps/tests/test_allowlist_parity.py -v

      # Reporting, not blocking. Dead agents and dangling script references are
      # real findings, but they are pre-existing debt — failing the build on them
      # would only teach everyone to ignore a red check. Read the log.
      - name: Prompt tree integrity (root)
        continue-on-error: true
        run: node .claude/scripts/check-prompt-integrity.mjs --tree .claude

      - name: Prompt tree integrity (template)
        continue-on-error: true
        run: node .claude/scripts/check-prompt-integrity.mjs --tree template/.claude

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install pytest pytest-cov ruff
          # ARCH-186/BUG-188/ARCH-193: scripts/vps imports need pyyaml
          # (lifecycle.py) and claude-agent-sdk (claude-runner.py).
          pip install -r scripts/vps/requirements.txt
      - name: Run tests with coverage
        # TODO: raise --cov-fail-under once scripts/vps has proper test coverage
        run: |
          pytest tests/ -v --cov=scripts/vps --cov-report=term-missing --cov-fail-under=0
